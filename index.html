<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <title>Design Archive</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/figma-theme.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="./">DESIGN<br />ARCHIVE</a>
      <nav class="header-view-switcher view-switcher" aria-label="콘텐츠 보기">
        <button type="button" data-view="archive" aria-pressed="true">레퍼런스</button>
        <button type="button" data-view="news" aria-pressed="false">디자인 뉴스</button>
        <button type="button" data-view="translation" aria-pressed="false">주간 번역</button>
      </nav>
      <p class="header-date" id="today"></p>
    </header>
    <main>
      <section class="toolbar discovery-hero" aria-label="아카이브 탐색">
        <div class="hero-heading">
          <p>CURATED DESIGN LIBRARY</p>
          <h1>좋은 디자인을<br />더 쉽게 발견하세요.</h1>
        </div>
        <div class="hero-controls">
          <p>실무에 다시 쓸 수 있는 화면과 디자인 변화를 한곳에서 탐색합니다.</p>
        </div>
        <div class="search-shell">
          <span class="search-icon" aria-hidden="true"></span>
          <label class="sr-only" for="archive-search">레퍼런스 검색</label>
          <input id="archive-search" type="search" placeholder="제목, 태그, 메모 검색" autocomplete="off" />
          <kbd aria-hidden="true">/</kbd>
          <button class="search-clear" id="search-clear" type="button" aria-label="검색어 지우기">지우기</button>
        </div>
      </section>
      <nav class="archive-navigation" aria-label="아카이브 보기와 분야 필터">
        <div class="filters" id="filters"></div>
        <p id="count" class="count" aria-live="polite"></p>
      </nav>
      <section id="archive" class="archive-grid" aria-live="polite"></section>
      <section id="news" class="news-list" aria-live="polite" hidden></section>
      <section id="translation" class="translation-list" aria-live="polite" hidden></section>
      <section id="empty-state" class="empty-state" hidden>
        <p class="empty-code">NO MATCH / 404</p>
        <h2>찾는 레퍼런스가 없습니다.</h2>
        <p>검색어를 줄이거나 다른 카테고리를 선택해 보세요.</p>
        <button id="reset-search" type="button">전체 목록으로 돌아가기</button>
      </section>
    </main>
    <template id="card-template">
      <article class="reference-card">
        <a class="thumbnail-link" target="_blank" rel="noreferrer" aria-label="원본 레퍼런스 열기">
          <div class="visual" aria-hidden="true">
            <span class="visual-index"></span>
            <span class="thumbnail-category"></span>
            <span class="visual-shape shape-one"></span>
            <span class="visual-shape shape-two"></span>
            <span class="visual-label"></span>
          </div>
        </a>
        <div class="card-body">
          <div class="card-topline"><span class="category"></span><span class="date"></span></div>
          <h2></h2>
          <p class="summary"></p>
          <p class="designer-note"></p>
          <div class="prompt-block">
            <p class="prompt"></p>
            <button class="copy-prompt" type="button">프롬프트 복사</button>
          </div>
          <ul class="tags"></ul>
        </div>
      </article>
    </template>
    <template id="news-template">
      <article class="news-card">
        <a class="news-thumbnail" target="_blank" rel="noreferrer"><img alt="" loading="lazy" /></a>
        <div class="news-content">
          <div class="news-meta"><span class="news-topic"></span><span class="news-source"></span><time></time></div>
          <h2><a target="_blank" rel="noreferrer"></a></h2>
          <p class="news-summary"></p><p class="news-impact"></p><ul class="tags"></ul>
        </div>
        <a class="news-arrow" target="_blank" rel="noreferrer" aria-label="원문 읽기">↗</a>
      </article>
    </template>
    <template id="translation-template">
      <article class="translation-card">
        <div class="translation-source">
          <div class="translation-example"><img alt="" loading="lazy" /></div>
          <div class="translation-source-row"><p class="translation-source-label">APPLIED PREVIEW</p><a class="translation-reference-link" target="_blank" rel="noreferrer">기준 보기 ↗</a></div>
        </div>
        <div class="translation-content">
          <div class="translation-meta"><span class="translation-channel"></span><span class="translation-decision"></span><span class="translation-priority"></span></div>
          <h3 class="translation-application-title"></h3>
          <p class="translation-application-line"></p>
          <div class="translation-action"><span>실제로 바꿀 것</span><ul></ul></div>
          <div class="translation-outcome"><span>기대 효과</span><p></p></div>
          <details class="translation-rationale"><summary>레퍼런스에서 가져온 판단</summary><p class="translation-steal"></p><p class="translation-source-title"></p></details>
        </div>
      </article>
    </template>
    <script src="data/references.js"></script>
    <script src="data/news.js"></script>
    <script src="data/weekly-translations.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
